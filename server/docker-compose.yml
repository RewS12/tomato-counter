services:
  server:
    build:
      context: .
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: tomato-server
    ports:
      - "8002:8000"
    environment:
      DEVICE: cpu
      MODEL_ADMIN_TOKEN: ${MODEL_ADMIN_TOKEN:-}
    volumes:
      # config.py в контейнере ищет веса в /models (ROOT = /)
      - ../models:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
